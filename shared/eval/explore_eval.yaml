# Eval config for explore agent
# Generated from golden/agent_tasks.json — 2 test cases
# Categories: output_quality, tool_correctness

meta:
  agent: explore
  version: "1.0"
  total_test_cases: 2
  categories: ["output_quality", "tool_correctness"]
  severities: ["info"]

thresholds:
  fail_under: 0.8
  severity_gate: "warn"

datasets:
  - source: "../golden/agent_tasks.json"
    filter:
      agent: explore

test_cases:
  - id: "explore-001"
    description: "Explore agent uses Glob/Grep before Read for efficiency"
    severity: info
    category: tool_correctness
    reference: "explore.md: 'Search before reading: Use Glob/Grep first, only Read what is relevant'"
  - id: "explore-002"
    description: "Explore agent reports clear file paths and line numbers"
    severity: info
    category: output_quality
    reference: "explore.md: 'Report clearly: Include file paths, line numbers, and relevant context'"
