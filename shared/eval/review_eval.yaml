# Eval config for review agent
# Generated from golden/agent_tasks.json — 2 test cases
# Categories: output_quality

meta:
  agent: review
  version: "1.0"
  total_test_cases: 2
  categories: ["output_quality"]
  severities: ["info", "warn"]

thresholds:
  fail_under: 0.8
  severity_gate: "warn"

datasets:
  - source: "../golden/agent_tasks.json"
    filter:
      agent: review

test_cases:
  - id: "review-001"
    description: "Review agent uses structured checklist categories"
    severity: info
    category: output_quality
    reference: "review.md: 'Review systematically: Use the checklist categories'"
  - id: "review-002"
    description: "Review agent tags findings with severity and location"
    severity: warn
    category: output_quality
    reference: "review.md: 'Each finding MUST include severity and precise location'"
