# Eval config for video-creator agent
# Generated from golden/agent_tasks.json — 2 test cases
# Categories: output_quality, tool_correctness

meta:
  agent: video-creator
  version: "1.0"
  total_test_cases: 2
  categories: ["output_quality", "tool_correctness"]
  severities: ["info", "warn"]

thresholds:
  fail_under: 0.8
  severity_gate: "warn"

datasets:
  - source: "../golden/agent_tasks.json"
    filter:
      agent: video-creator

test_cases:
  - id: "video-creator-001"
    description: "Video creator verifies input files before processing"
    severity: warn
    category: tool_correctness
    reference: "video-creator.md: 'Verify inputs first: Always check input files exist before calling create_video()'"
  - id: "video-creator-002"
    description: "Video creator uses platform presets instead of hardcoded resolutions"
    severity: info
    category: output_quality
    reference: "video-creator.md: 'Use platform presets for correct aspect ratios — dont hardcode resolutions'"
