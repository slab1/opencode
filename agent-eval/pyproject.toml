[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Standalone agent evaluation toolkit — audit, eval, scorecard, A/B compare, strategy tracking"
authors = [
    {name = "OpenCode Contributors"},
]
license = {text = "MIT"}
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/opencode/agent-eval"
Repository = "https://github.com/opencode/agent-eval"

[project.scripts]
agent-eval = "agent_evals.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_evals*"]
